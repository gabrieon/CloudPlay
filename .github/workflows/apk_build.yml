name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleStableDebug

      - name: Get APK path
        id: apk-path
        run: echo "path=$(find app/build/outputs/apk/stable/debug/ -name "*.apk" | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Material 3 Build
          body: "Automatic build of the latest Material 3 UI transformation."
          draft: false
          prerelease: false
          files: ${{ steps.apk-path.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
