name: Build APK and create Release

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build app debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Debug build output
        if: always()
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APKs found"

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found! Checking build directory structure:"
            find app/build -type d -name apk 2>/dev/null || echo "No apk directory found"
            find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create apk-${{ github.run_number }}-${{ github.sha }} \
            --title "APK Release ${{ github.run_number }}" \
            --notes "Automated APK build" \
            app/build/outputs/apk/debug/app-debug.apk
